# Postgres + the FastAPI service. `scripts/setup_db.sh` brings both up and
# loads the Catalonia asset register and forests.
#
# The project name is pinned: Compose otherwise derives it from this file's
# directory, and moving the file would silently point at a different (empty)
# volume.
name: hackbarna_fireprotector

services:
  db:
    image: postgres:18
    container_name: fireprotector-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fireprotector}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fireprotector}
      POSTGRES_DB: ${POSTGRES_DB:-fireprotector}
      # Pinned explicitly: postgres:18 moved its default data directory, and
      # this keeps the named volume valid whichever image tag is used.
      PGDATA: /var/lib/postgresql/data
    ports:
      # Bound to loopback: the database is not exposed to the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      # Staging area the loader writes CSVs to and the server COPYs from.
      - ./db/import:/import
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fireprotector} -d ${POSTGRES_DB:-fireprotector}"]
      interval: 2s
      timeout: 3s
      retries: 45
    # Tuned for one long series of bulk inserts. max_wal_size stays modest on
    # purpose: a larger checkpoint target speeds the load up slightly but lets
    # WAL grow by that much on disk, which is not worth it here.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_wal_size=1GB
      - -c
      - synchronous_commit=off

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: fireprotector-api
    container_name: fireprotector-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # ELMFIRE shares rasters between MPI ranks via /dev/shm; the 64 MB default
    # is far too small for a 40 km domain.
    shm_size: "2gb"
    environment:
      # Inside the compose network the database is reachable as `db`. This
      # overrides anything in .env, which targets localhost for running the
      # API straight on the host instead.
      DATABASE_URL: postgresql://${POSTGRES_USER:-fireprotector}:${POSTGRES_PASSWORD:-fireprotector}@db:5432/${POSTGRES_DB:-fireprotector}
      ASSET_SPECS_TABLE: protection.asset_specs
      LATITUDE_COLUMN: latitude
      LONGITUDE_COLUMN: longitude
      # Deepfire credentials. Not read by this API any more (the fire spread is
      # the self-hosted ELMFIRE pipeline below); passed through from backend/.env
      # for other Deepfire users, since the image carries no .env.
      DEEPFIRE_CLIENT_ID: ${DEEPFIRE_CLIENT_ID:-}
      DEEPFIRE_CLIENT_SECRET: ${DEEPFIRE_CLIENT_SECRET:-}
      # ELMFIRE fire-spread pipeline behind /fire/arrival-grid. The static tier
      # and run directories live on the data/fire_spread bind mount below;
      # scripts/setup_fire_data.sh builds the tier. See fire_spread/README.md
      # for the remaining knobs (all read from the environment / backend/.env).
      # PIPELINE_MODE picks the model-knob bundle the API serves by default:
      # base (stock ELMFIRE) or tuned (our Catalan adjustments, fire_spread/modes.py).
      PIPELINE_MODE: ${PIPELINE_MODE:-tuned}
      # Optional Open-Meteo commercial key (free tier: 10 000 weighted calls/day per IP).
      OPEN_METEO_API_KEY: ${OPEN_METEO_API_KEY:-}
      ELMFIRE_NPROC: ${ELMFIRE_NPROC:-4}
      DATA_DIR: /srv/data/fire_spread/catalonia
      RUNS_DIR: /srv/data/fire_spread/runs
      KEEP_RUNS: ${KEEP_RUNS:-failed}
      MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-1}
      # Nebius Token Factory, for the /api briefings. Left unset, the decision
      # layer writes deterministic template briefings rather than calling an
      # LLM, and every other route is unaffected.
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
      # Overpass mirrors for the named critical facilities, as a JSON array.
      # Unset uses the provider's own list. Worth pinning on a network where
      # the default mirror is unreachable: without it the ranking still works,
      # but nothing in it has a name.
      OVERPASS_URLS: ${OVERPASS_URLS:-}
    ports:
      # 5102 is the port the asset-register contract names, so the frontend and
      # the decision layer find the API where they expect it.
      - "127.0.0.1:${API_PORT:-5102}:8000"
    volumes:
      # Code is mounted over the image copy and uvicorn reloads on change, so
      # editing app/ or fire_spread/ does not need a rebuild.
      - ./app:/srv/app:ro
      - ./fire_spread:/srv/fire_spread:ro
      - ./scripts/fire_spread:/srv/scripts/fire_spread:ro
      # Read-write: the decision layer's recorded scenario bundles, briefing
      # cache and log, and under data/fire_spread the ELMFIRE static tier,
      # source downloads, run directories and hindcast results. A bind mount
      # rather than a named volume so a recorded bundle can be inspected,
      # committed or hand-copied between machines. On Linux hosts make
      # data/fire_spread writable by uid 10001.
      - ./data:/srv/data
    # Reload only watches the code mounts: ELMFIRE writes run directories under
    # /srv/data, and watching those would restart the server mid-simulation.
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000",
       "--reload", "--reload-dir", "app", "--reload-dir", "fire_spread"]

volumes:
  pgdata:
